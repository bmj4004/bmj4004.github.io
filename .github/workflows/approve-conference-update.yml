name: Approve conference update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: conference-update
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == '[Conference schedule] Update request' &&
      github.event.comment.body == '/approve' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate and apply the requested changes
        run: node .github/scripts/apply-conference-request.mjs

      - name: Commit the approved data
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/sysvenues.json
          if git diff --cached --quiet; then
            echo "The approved request produces no data change."
          else
            git commit -m "Apply conference update request #${ISSUE_NUMBER}"
            git push origin HEAD:main
          fi

      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds"

      - name: Close the approved request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Approved and applied. The GitHub Pages build has been requested.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
